# ---------- Sélection des modèles ----------
# Valeurs possibles : google-genai | openai | anthropic | mistral | deepseek | azure-openai | bedrock-converse | zhipuai
spring.ai.model.chat=google-genai

# ---------- Embeddings : Ollama (local) ----------
spring.ai.model.embedding=ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.options.model=bge-m3

# Désactivés tant qu'ils ne sont pas utilisés (sinon chaque starter exige sa clé)
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none


# ---------- Paramètres communs ----------
# (à répéter par fournisseur ci-dessous)

# ---------- Google Gemini (actif) ----------
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-2.5-flash}
spring.ai.google.genai.chat.options.temperature=${AI_TEMPERATURE:0.3}

# ---------- OpenAI et compatibles (OpenRouter, Groq, Together, xAI...) ----------
# OpenRouter : https://openrouter.ai/api
# Groq       : https://api.groq.com/openai
# OpenAI     : https://api.openai.com
spring.ai.openai.api-key=${OPENROUTER_API_KEY:}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://openrouter.ai/api}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:openrouter/free}
spring.ai.openai.chat.options.temperature=${AI_TEMPERATURE:0.3}

# ---------- Anthropic ----------
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.anthropic.chat.options.model=${ANTHROPIC_MODEL:claude-sonnet-5-5}
spring.ai.anthropic.chat.options.max-tokens=${AI_MAX_TOKENS:4096}
spring.ai.anthropic.chat.options.temperature=${AI_TEMPERATURE:0.3}

# ---------- Azure OpenAI ----------
spring.ai.azure.openai.api-key=${AZURE_OPENAI_API_KEY:}
spring.ai.azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT:}
spring.ai.azure.openai.chat.options.deployment-name=${AZURE_OPENAI_DEPLOYMENT:}

# ---------- Mistral AI ----------
spring.ai.mistralai.api-key=${MISTRAL_API_KEY:}
spring.ai.mistralai.chat.options.model=${MISTRAL_MODEL:mistral-small-latest}

# ---------- DeepSeek ----------
spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY:}
spring.ai.deepseek.chat.options.model=${DEEPSEEK_MODEL:deepseek-chat}

# ---------- Amazon Bedrock ----------
spring.ai.bedrock.aws.region=${AWS_REGION:us-east-1}
spring.ai.bedrock.converse.chat.options.model=${BEDROCK_MODEL:}

# ---------- ZhiPu AI ----------
spring.ai.zhipuai.api-key=${ZHIPUAI_API_KEY:}