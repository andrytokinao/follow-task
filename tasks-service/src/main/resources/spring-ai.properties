# À ajouter dans application.properties.
# Tout se change par variables d'environnement, sans toucher au code.
#
# Choisir le fournisseur actif :   AI_CHAT_PROVIDER=openai   (ou anthropic, ollama, ...)
# Démarrer SANS IA :               AI_CHAT_PROVIDER=none

# Un seul ChatModel est créé (évite les clés manquantes des autres fournisseurs
# et l'erreur "plusieurs ChatModel").
# Valeurs : anthropic | openai | azure-openai | ollama | mistral | deepseek
#           | google-genai | bedrock-converse | zhipuai | none
spring.ai.model.chat=${AI_CHAT_PROVIDER:anthropic}

# Désactivés tant que tu n'en as pas besoin (sinon chaque starter exige sa clé)
spring.ai.model.embedding=${AI_EMBEDDING_PROVIDER:none}
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none

# ---------- Anthropic ----------
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.anthropic.chat.options.model=${ANTHROPIC_MODEL:claude-sonnet-5-5}
spring.ai.anthropic.chat.options.max-tokens=${AI_MAX_TOKENS:4096}
spring.ai.anthropic.chat.options.temperature=${AI_TEMPERATURE:0.3}

# ---------- OpenAI (et compatibles : Groq, OpenRouter, Together, xAI...) ----------
spring.ai.openai.api-key=${OPENAI_API_KEY:}
# Groq : https://api.groq.com/openai   OpenRouter : https://openrouter.ai/api
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=${AI_TEMPERATURE:0.3}

# ---------- Azure OpenAI ----------
spring.ai.azure.openai.api-key=${AZURE_OPENAI_API_KEY:}
spring.ai.azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT:}
spring.ai.azure.openai.chat.options.deployment-name=${AZURE_OPENAI_DEPLOYMENT:}

# ---------- Ollama (local) ----------
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:llama3.1}

# ---------- Mistral AI ----------
spring.ai.mistralai.api-key=${MISTRAL_API_KEY:}
spring.ai.mistralai.chat.options.model=${MISTRAL_MODEL:mistral-small-latest}

# ---------- DeepSeek ----------
spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY:}
spring.ai.deepseek.chat.options.model=${DEEPSEEK_MODEL:deepseek-chat}

# ---------- Google Gemini ----------
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-2.5-flash}

# ---------- Amazon Bedrock ----------
spring.ai.bedrock.aws.region=${AWS_REGION:us-east-1}
spring.ai.bedrock.converse.chat.options.model=${BEDROCK_MODEL:}

# ---------- ZhiPu AI ----------
spring.ai.zhipuai.api-key=${ZHIPUAI_API_KEY:}
