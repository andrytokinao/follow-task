server.port = 8081

# Compression des reponses. Les bundles JavaScript et les reponses GraphQL
# sont du texte tres repetitif : gzip divise leur taille par 4 a 8. Sans cela,
# le frontend partait sur le reseau en taille brute.
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/graphql-response+json,application/manifest+json,image/svg+xml
server.compression.min-response-size=1024

spring.servlet.multipart.max-file-size=2000MB
spring.servlet.multipart.max-request-size=2000MB
spring.jpa.properties.hibernate.format_sql=true
logging.file.name=logs/follow-task.log
cors.allowed-origins=http://localhost:4200
