# Adresse publique de l'application (ex. https://paikady.exemple.mg), sans barre
# finale. Laissee vide, le serveur ne cherche pas a la deviner : derriere un
# proxy il se tromperait. Consequence dans les rapports : les cles des demandes
# restent cliquables dans la page HTML (adressage relatif, meme origine) mais
# sont du texte simple dans le PDF, un lien relatif ne menant nulle part une
# fois le fichier sorti de l'application. La renseigner rend les cles du PDF
# cliquables.
app.base-url= 
project.version=@project.version@
app.version=@app.version@

