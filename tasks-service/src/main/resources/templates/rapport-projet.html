<!DOCTYPE html>
<!--
  Rapport d'avancement d'un projet.

  Ce template sert deux sorties : la page HTML rendue par le serveur et le PDF
  produit par OpenHTMLtoPDF à partir de ce même HTML. D'où deux contraintes qui
  expliquent la mise en page :

  - le balisage est du XHTML strict (balises vides auto-fermées, entités
    numériques), car le convertisseur PDF le parse comme du XML ;
  - la mise en page n'utilise ni flexbox, ni grid, ni dégradé : uniquement
    « display: block » et des tableaux, seules constructions rendues à
    l'identique par le moteur PDF.

  Le camembert est une image PNG encodée en base64, peinte par GraphiqueService :
  OpenHTMLtoPDF n'exécute aucun JavaScript, aucune bibliothèque de graphiques ne
  peut donc fonctionner ici.

  La page ne porte plus que son en-tête et son pied : la mise en page du projet
  vit dans « rapport-projet-corps.html », que le rapport multi-projets répète.
-->
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8" />
    <title th:text="'Rapport - ' + ${rapport.titre}">Rapport de projet</title>
    <style type="text/css" th:replace="~{rapport-styles :: styles}"></style>
</head>
<body>

<!-- Répété au bas de chaque page par la règle @page de la feuille de style. -->
<div id="piedDePage">
    <span th:if="${rapport.cle}" th:text="${rapport.cle} + ' - '">PRJ-1 - </span>
    <span th:text="${rapport.titre}">Projet</span>
    <span th:if="${rapport.genereLe != null}"
          th:text="' - édité le ' + ${#temporals.format(rapport.genereLe, 'dd/MM/yyyy à HH:mm')}"></span>
</div>

<div th:replace="~{rapport-projet-corps :: corps(${rapport}, ${graphiqueRepartition}, ${couleurs}, ${lienBase})}"></div>

</body>
</html>
