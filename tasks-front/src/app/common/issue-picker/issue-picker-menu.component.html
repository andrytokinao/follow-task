<mat-menu #menu="matMenu" class="issue-picker-menu" [hasBackdrop]="true">
  <div class="issue-tree-scroll" (click)="$event.stopPropagation()">
    <ng-container *ngTemplateOutlet="nodeList; context: { issues: issues, depth: 0 }"></ng-container>

    <!-- Template récursif : un niveau de l'arbre. Se ré-invoque pour les
         enfants d'une issue dépliée, avec depth + 1 pour l'indentation —
         tout reste dans le même panneau, sans overlay supplémentaire. -->
    <ng-template #nodeList let-issues="issues" let-depth="depth">
      <ng-container *ngFor="let issue of issues">
        <div class="issue-tree-row" [style.paddingLeft.px]="depth * 16">
          <button
            class="issue-tree-toggle"
            *ngIf="hasChildren(issue); else noToggle"
            (click)="toggleExpand(issue, $event)"
            [attr.title]="isExpanded(issue) ? 'Replier' : 'Déplier'"
          >
            <i class="fas fa-chevron-right" [class.expanded]="isExpanded(issue)"></i>
          </button>
          <ng-template #noToggle>
            <span class="issue-tree-toggle-spacer"></span>
          </ng-template>

          <!-- Ligne cliquable : PAS un mat-menu-item, pour que cocher une
               case ne ferme jamais le menu et permette d'en cocher plusieurs. -->
          <div
            class="issue-tree-item"
            [class.selected]="isSelected(issue)"
            (click)="toggleSelect(issue, $event)"
          >
            <span class="issue-tree-checkbox" [class.checked]="isSelected(issue)">
              <i class="fas fa-check" *ngIf="isSelected(issue)"></i>
            </span>

            <span class="issue-picker-key">{{ issue.issueKey }}</span>
            <span class="issue-picker-summary">{{ issue.summary }}</span>

            <span
              class="issue-picker-progress"
              *ngIf="issue.currentCompletionPercent !== undefined && issue.currentCompletionPercent !== null"
            >
              <span class="progress-dot" [ngClass]="progressClass(issue.currentCompletionPercent)"></span>
              {{ issue.currentCompletionPercent }}%
            </span>
          </div>
        </div>

        <ng-container *ngIf="hasChildren(issue) && isExpanded(issue)">
          <ng-container *ngTemplateOutlet="nodeList; context: { issues: issue.children, depth: depth + 1 }"></ng-container>
        </ng-container>
      </ng-container>
      +
    </ng-template>

    <div class="issue-picker-empty" *ngIf="!issues.length">
      Aucune issue disponible
    </div>
  </div>

  <!-- Pied de menu : actions globales, en dehors du template récursif. -->
  <div class="issue-picker-footer">
    <button
      mat-menu-item
      class="footer-btn footer-btn-secondary"
      (click)="onCreateSubIssueClick()"
    >
      <i class="fas fa-plus"></i>
      <span>Nouvelle sous-issue</span>
    </button>
    <button
      mat-menu-item
      class="footer-btn footer-btn-primary"
      [disabled]="selectionCount === 0"
      (click)="onCreateClick()"
    >
      <i class="fas fa-check"></i>
      <span>Créer{{ selectionCount > 0 ? ' (' + selectionCount + ')' : '' }}</span>
    </button>
  </div>
</mat-menu>
