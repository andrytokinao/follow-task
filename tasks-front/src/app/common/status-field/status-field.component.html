<span class="controle" [class.icone-seule]="!afficherLibelle" [matMenuTriggerFor]="menu2" mat-icon-button [ngStyle]="statusStyle()"
      [title]="issue.status?.displayName || 'No status'">
  <span  *ngIf="issue.status != null "><app-icone-view [icon]="issue.status.icone" [color]="issue.status.color"></app-icone-view><ng-container *ngIf="afficherLibelle"> {{issue.status.displayName}}</ng-container> </span>
<span *ngIf="issue.status == null " ><ng-container *ngIf="afficherLibelle; else sansStatut">No status</ng-container></span>
<i class="fas fa-chevron-down" *ngIf="afficherLibelle"></i>
</span>
<!-- Icône seule, sans statut : un rond vide plutôt qu'un texte. -->
<ng-template #sansStatut><i class="far fa-circle"></i></ng-template>

<mat-menu #menu2="matMenu">
  <div *ngIf="peutChangerStatut$ | async">
    <h4> status  </h4>
    <span  *ngIf="issueType != null && issueType.curentWorkFlow != null && issueType.curentWorkFlow.statuses != null && issueType.curentWorkFlow.statuses.length !=0 ">
       <button  mat-menu-item *ngFor="let status of issueType.curentWorkFlow.statuses" (click)="changeStatus(status)"
                [ngClass]="{'active': isActive(status)}">
      <span [style.color]="status.color"><app-icone-view [icon]="status.icone" [color]="status.color"></app-icone-view> {{status.displayName}} </span>

    </button>
    </span>

    <span  *ngIf="issueType == null || issueType.curentWorkFlow == null || issueType.curentWorkFlow.statuses	 == null || issueType.curentWorkFlow.statuses	.length ==0 ">
      <span  > Flus de traveau non configuré </span>

    </span>
  </div>
</mat-menu>
