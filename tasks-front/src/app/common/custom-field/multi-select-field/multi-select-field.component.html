
<ng-container *ngIf="!isEditing"> <i *ngFor="let v of values"> {{v}}, </i> </ng-container>
<ng-container *ngIf="isEditing">
  <div *ngFor="let option of options">
    <mat-checkbox
      [checked]="isSelected(option)"
      (change)="onCheckboxChange($event,option)"
    >
      {{ option }}
    </mat-checkbox>
  </div>
</ng-container>
