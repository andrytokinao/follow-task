<!-- dossier-node-item.component.html -->

<div class="fni-row"
     [class.fni-selected]="isSelected()"
     [class.fni-last-selected]="isLastSelected()">

  <!-- Case à cocher (sélection multiple) -->
  <span class="fni-checkbox"
        [class.fni-checkbox--checked]="isSelected()"
        (click)="onCheckboxClick($event)"
        title="Sélectionner">
    <i class="ti ti-check" *ngIf="isSelected()"></i>
  </span>

  <!-- Chevron (dossier uniquement) -->
  <span class="fni-chevron"
        *ngIf="_repertoire.type === 'folder'"
        (click)="toggleOpen($event)">
    <i class="ti"
       [class.ti-chevron-right]="!_repertoire.open"
       [class.ti-chevron-down]="_repertoire.open"></i>
  </span>
  <span class="fni-chevron-ph" *ngIf="_repertoire.type !== 'folder'"></span>

  <!-- Icône fichier/dossier -->
  <span class="fni-icon" [style.color]="typeInfo.iconColor" (click)="onClick($event)">
    <i class="ti" [ngClass]="typeInfo.icon"></i>
  </span>

  <!-- Nom du fichier -->
  <span class="fni-label" (click)="onClick($event)" [title]="_repertoire.fileName">
    {{ _repertoire.fileName }}
  </span>

  <!-- Badge type -->
  <span class="fni-badge" [ngClass]="typeInfo.badgeClass" *ngIf="typeInfo.badge">
    {{ typeInfo.badge }}
  </span>

</div>

<!-- Enfants (récursif) -->
<div class="fni-children"
     *ngIf="_repertoire.type === 'folder' && _repertoire.repertoires?.length > 0"
     [class.fni-children--open]="_repertoire.open"
     [class.fni-children--closed]="!_repertoire.open">
  <app-dossier-node-item
    *ngFor="let r of _repertoire.repertoires"
    [repertoire]="r"
    [lastSelectedPath]="lastSelectedPath"
    [selectedPaths]="selectedPaths"
    (fileSelected)="onFileSelected($event)"
    (selectionToggled)="onSelectionToggled($event)">
  </app-dossier-node-item>
</div>
