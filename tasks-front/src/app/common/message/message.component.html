<!-- Zone de chat -->
<div class="chat-container">
  <div class="chat-header">
    <div class="chat-title">
      <img [src]="getPhoto()" alt="Avatar" class="avatar">
      <span>{{ chatName() || 'Sélectionnez une discussion' }}</span>
    </div>
    <button class="close-btn" aria-label="Fermer" (click)="closeChat()">
      <i class="fas fa-times"></i>
    </button>
  </div>

  <div class="chat-body">
    <div class="chat-info">
      <span>Discussion avec {{ chatName() }}</span>
    </div>

    <div *ngFor="let message of canal?.messageApp"
         class="message"
         [class.sent]="messageService.senderIsMe(message)">
      <img *ngIf="!messageService.senderIsMe(message)"
           [src]="messageService.getSenderPhoto(message)"
           alt="Avatar"
           class="avatar">
      <div class="message-content">
        {{ message.text }}
      </div>
    </div>
  </div>

  <div class="chat-footer">
    <input [(ngModel)]="newMessage" placeholder="Tapez un message..." />
    <button (click)="sendMessage()">
      <i class="fas fa-paper-plane"></i>
    </button>
  </div>
</div>
