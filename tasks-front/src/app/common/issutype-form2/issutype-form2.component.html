<div class="form-shell" (click)="$event.stopPropagation()">
  <ng-container >

    <!-- Label de niveau -->
    <div class="level-strip" [class.is-sub]="level === 'SUB_TASK'">
      <mat-icon>{{ level === 'SUB_TASK' ? 'subdirectory_arrow_right' : 'folder_special' }}</mat-icon>
      <span>{{ level === 'SUB_TASK' ? 'Typet Tache' : 'Type principal' }}</span>
      <span class="parent-hint" *ngIf="level === 'SUB_TASK' && parent">
        — {{ parent.name }}
      </span>
    </div>

    <!-- Formulaire -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="issue-form">

      <mat-form-field appearance="outline" class="fw">
        <mat-label>Nom</mat-label>
        <input matInput formControlName="name" placeholder="Ex: Relevé topographique">
        <mat-error *ngIf="form.get('name')?.hasError('required')">Obligatoire</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="fw">
        <mat-label>Préfixe</mat-label>
        <input matInput formControlName="prefix" placeholder="Ex: RTS">
        <mat-error *ngIf="form.get('prefix')?.hasError('required')">Obligatoire</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="fw">
        <mat-label>Description</mat-label>
        <textarea matInput formControlName="description"
                  cdkTextareaAutosize cdkAutosizeMinRows="2" cdkAutosizeMaxRows="5"
                  placeholder="Rôle et usage de ce type…"></textarea>
      </mat-form-field>

      <!-- Couleur + Icône -->
      <div class="row-pair">

        <div class="field-group">
          <span class="mini-label">Couleur</span>
          <div class="color-row">
            <span class="color-dot" [style.background]="form.get('color')?.value"></span>
            <ngx-colors ngx-colors-trigger
                        formControlName="color"
                        [palette]="colorPalette"
                        [hideTextInput]="false"
                        format="hex">
            </ngx-colors>
          </div>
        </div>

        <div class="field-group">
          <span class="mini-label">Icône</span>
          <button mat-stroked-button type="button"
                  [matMenuTriggerFor]="iconMenu"
                  #iconMenuTrigger="matMenuTrigger"
                  class="icon-btn">
            <mat-icon [style.color]="form.get('color')?.value">
              {{ selectedIcone?.value || 'category' }}
            </mat-icon>
            <span>{{ selectedIcone?.value || 'Choisir' }}</span>
            <mat-icon class="arrow">expand_more</mat-icon>
          </button>
          <mat-menu #iconMenu="matMenu">
            <div (click)="$event.stopPropagation()">
              <app-choose-dialog (iconSelected)="onIconSelected($event)"></app-choose-dialog>
            </div>
          </mat-menu>
        </div>

      </div>

      <!-- Aperçu live -->
      <div class="preview" *ngIf="form.get('name')?.value"
           [style.--c]="form.get('color')?.value || '#6C63FF'">
        <app-icone-view [icon]="selectedIcone" [color]="form.get('color')?.value || '#6C63FF'"></app-icone-view>
        <code *ngIf="form.get('prefix')?.value">{{ form.get('prefix')?.value }}</code>
      </div>

      <p class="err" *ngIf="errorMessage">
        <mat-icon>error_outline</mat-icon> {{ errorMessage }}
      </p>

      <!-- Actions -->
      <div class="actions">
        <button mat-button type="button" (click)="onReset()" [disabled]="saving">
          Réinitialiser
        </button>
        <button mat-flat-button color="primary" type="submit"
                [disabled]="form.invalid || saving">
          {{ saving ? 'Enregistrement…' : 'Créer' }}
        </button>
      </div>

    </form>

  </ng-container>
</div>
