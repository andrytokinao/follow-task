<span class="assigne" [class.assigne-lecture]="canAssign === false">
  <!-- Sans droit, pas de menu : le declencheur ne fait rien. -->
  <span #menuTrigger="matMenuTrigger" [matMenuTriggerFor]="canAssign ? menu2 : null"
        (click)="onTriggerClick()" (menuClosed)="onMenuClosed()"
        class="assigne-trigger" [title]="assigneesTitle">
    <span class="avatar-stack" *ngIf="assignees.length > 0">
      <app-avatar *ngFor="let user of visibleAssignees"
                  [url]="photoUrl(user)"
                  [displayName]="displayName(user)"
                  [title]="displayName(user)"></app-avatar>
      <span class="avatar-more" *ngIf="hiddenCount > 0" [title]="assigneesTitle">+{{ hiddenCount }}</span>
    </span>
    <span *ngIf="assignees.length == 0" class="avatar-vide" title="Non assigné">?</span>
    <b class="assigne-label" *ngIf="maxLabelWidth > 0" [style.max-width.px]="maxLabelWidth">{{ assigneesLabel }}</b>
  </span>

  <mat-menu #menu2="matMenu" class="assigne-menu">
    <div class="assigne-panel" (click)="stopPropagation($event)">
      <div class="assigne-panel-header">
        <h4> Assigner à </h4>
        <input type="text" class="assigne-search" placeholder="Rechercher un membre..."
               [(ngModel)]="searchTerm"/>
      </div>

      <!-- Boutons simples plutot que mat-menu-item : ce dernier enveloppe son
           contenu dans un span non flex, qui empilait avatar et nom. -->
      <div class="assigne-list" role="listbox" aria-multiselectable="true">
        <button type="button" class="assigne-option" role="option"
                *ngFor="let user of filteredUsers"
                [class.active]="isActive(user)"
                [attr.aria-selected]="isActive(user)"
                [disabled]="saving"
                (click)="toggleUser(user, $event)">
          <app-avatar [url]="photoUrl(user)" [displayName]="displayName(user)"></app-avatar>
          <span class="assigne-nom" [title]="displayName(user)">{{ displayName(user) }}</span>
          <i class="fas fa-check assigne-check" *ngIf="isActive(user)" aria-hidden="true"></i>
        </button>
        <div class="assigne-empty" *ngIf="filteredUsers.length == 0"> Aucun membre trouvé </div>
      </div>

      <div class="assigne-panel-footer">
        <span class="assigne-count">{{ assignees.length }} assigné(s)</span>
        <button type="button" class="assigne-clear" (click)="clearAssignment($event)"
                [disabled]="saving || assignees.length == 0"> Tout retirer
        </button>
      </div>
    </div>
  </mat-menu>
</span>
