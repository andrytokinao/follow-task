<div class="sit-shell">

  <header class="sit-topbar">
    <div class="sit-title">
      <h1>Situation du jour<span class="jour" *ngIf="jour"> · {{ jour }}</span><span class="jour" *ngIf="espace"> · {{ espace.nom }}</span></h1>
    </div>
    <div class="sit-actions">
      <span class="maj" *ngIf="miseAJour">
        <i class="fas fa-sync-alt" aria-hidden="true"></i> Mis à jour à {{ miseAJour }}
      </span>
    </div>
  </header>

  <div class="sit-state" *ngIf="chargement">
    <i class="fas fa-circle-notch fa-spin"></i> Calcul de la situation…
  </div>

  <div class="sit-state error" *ngIf="erreur">
    <i class="fas fa-plug"></i>
    {{ situation ? 'Actualisation impossible : la situation affichée date de ' + miseAJour + '.' : 'Impossible de calculer la situation. Rechargez la page.' }}
  </div>

  <ng-container *ngIf="situation && !chargement">

    <!-- ═══ 1. PEUT-ON CROIRE CE QU'ON LIT ═══ -->
    <section class="sit-card" aria-label="Fiabilité">
      <app-situation-fiabilite [fiabilite]="situation.fiabilite" [filtreActif]="seulementSansPlanning"
                               (basculerFiltre)="basculerFiltre()"></app-situation-fiabilite>
    </section>

    <div class="sit-layout">
      <!-- ═══ 2. OÙ EN EST-ON ═══ -->
      <section class="sit-card" aria-labelledby="titre-projets">
        <h2 id="titre-projets" class="sit-card-title">Où en est-on</h2>
        <app-situation-chiffres [chiffres]="situation.chiffres" [aTraiter]="situation.aTraiter"></app-situation-chiffres>
      </section>

      <!-- ═══ 3. QUI FAIT QUOI ═══ -->
      <section class="sit-card" aria-labelledby="titre-personnes">
        <h2 id="titre-personnes" class="sit-card-title">Qui fait quoi maintenant</h2>
        <app-situation-personnes [personnes]="situation.personnes"
                                 [seulementSansPlanning]="seulementSansPlanning"></app-situation-personnes>
      </section>
    </div>
  </ng-container>
</div>
