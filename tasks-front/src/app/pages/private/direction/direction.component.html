<div class="dir-shell">

  <header class="dir-topbar">
    <div class="topbar-title">
      <span class="brand-icon"><i class="fas fa-compass"></i></span>
      <h1>Direction</h1>
    </div>
    <div class="topbar-actions">
      <a class="back-link" routerLink="/working">
        <i class="fas fa-th-large"></i> Espaces de travail
      </a>
      <app-user-menu variante="avatar"></app-user-menu>
    </div>
  </header>

  <!-- ═══ DÉPARTEMENTS ═══ -->
  <nav class="dir-tabs" aria-label="Départements">
    <button type="button" class="dir-tab" [class.active]="departement === null" (click)="choisir(null)">
      Tous <span class="tab-count">{{ nombreProjets(null) }}</span>
    </button>
    <button type="button" class="dir-tab" *ngFor="let dep of departements"
            [class.active]="departement === dep" (click)="choisir(dep)">
      {{ dep }} <span class="tab-count">{{ nombreProjets(dep) }}</span>
    </button>
  </nav>

  <div class="state" *ngIf="chargement">
    <i class="fas fa-circle-notch fa-spin"></i> Chargement des projets…
  </div>

  <div class="state error" *ngIf="erreur">
    <i class="fas fa-plug"></i> Impossible de charger les projets. Rechargez la page.
  </div>

  <div class="dir-layout" *ngIf="!chargement && !erreur">

    <!-- ═══ MENU : PROJETS ═══ -->
    <aside class="dir-card dir-menu" aria-label="Projets">
      <div class="state" *ngIf="!projetsAffiches.length">
        <i class="fas fa-folder-open"></i> Aucun projet en cours dans ce département.
      </div>

      <ul class="menu-list">
        <li *ngFor="let p of projetsAffiches; trackBy: parId">
          <button type="button" class="menu-projet" [class.active]="selection === p" (click)="choisirProjet(p)">
            <i class="fas fa-folder project-icon"></i>
            <span class="menu-text">
              <span class="menu-line">
                <span class="project-key">{{ p.cle }}</span>
                <span class="menu-pct">{{ p.avancement }} %</span>
              </span>
              <span class="project-name" [title]="p.nom">{{ p.nom }}</span>
              <span class="meter-track"><span class="meter-fill" [style.width.%]="p.avancement"></span></span>
              <span class="menu-meta">
                <span class="menu-status" *ngIf="p.statut" [style.color]="p.statut.couleur">{{ p.statut.libelle }} ·</span>
                {{ p.nombreTaches }} tâche(s)
                <span class="late" *ngIf="p.tachesEnRetard">· {{ p.tachesEnRetard }} en retard</span>
              </span>
            </span>
          </button>
        </li>
      </ul>
    </aside>

    <!-- ═══ FICHE DU PROJET ═══ -->
    <section class="dir-card dir-detail">
      <app-direction-fiche-projet *ngIf="selection; else rien" [projet]="selection">
      </app-direction-fiche-projet>
      <ng-template #rien>
        <div class="state"><i class="fas fa-hand-pointer"></i> Choisissez un projet à gauche.</div>
      </ng-template>
    </section>
  </div>
</div>
