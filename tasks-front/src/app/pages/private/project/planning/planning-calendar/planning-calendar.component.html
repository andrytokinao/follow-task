<div class="planning-shell">

  <!-- Barre d'outils : tout ce qui pilote l'affichage est regroupé en haut
       (type de vue à gauche, filtres à droite). Le calendrier récupère ainsi
       toute la largeur, la colonne de gauche ne garde que le calendrier de
       saisie. -->
  <header class="planning-toolbar">

    <div class="toolbar-lead">

      <!-- Repli du mini-calendrier sur petit écran, où le panneau devient une
           surcouche : la poignée du bord n'aurait plus rien à border. -->
      <button
        type="button"
        class="icon-btn aside-toggle"
        [class.active]="asideOpen"
        [attr.aria-expanded]="asideOpen"
        aria-controls="planning-aside"
        (click)="toggleAside()"
        [title]="asideOpen ? 'Masquer le mini-calendrier' : 'Afficher le mini-calendrier'"
      >
        <i class="fas" [ngClass]="asideOpen ? 'fa-calendar-days' : 'fa-calendar'"></i>
      </button>

      <nav class="view-switch" aria-label="Type d'affichage">
        <button
          type="button"
          class="view-btn"
          *ngIf="projectGuard.hasCredential(['CAN_VIEW_TEAM_AGENDA']) | async"
          [class.active]="configNavigator.selectMode === 'None'"
          (click)="viewResources()"
        >
          <i class="fas fa-users"></i><span>Équipe</span>
        </button>
        <button
          type="button"
          class="view-btn"
          [class.active]="configNavigator.selectMode === 'Day'"
          (click)="viewDay()"
        >
          <i class="fas fa-calendar-day"></i><span>Jour</span>
        </button>
        <button
          type="button"
          class="view-btn"
          [class.active]="configNavigator.selectMode === 'Week'"
          (click)="viewWeek()"
        >
          <i class="fas fa-calendar-week"></i><span>Semaine</span>
        </button>
        <button
          type="button"
          class="view-btn"
          [class.active]="configNavigator.selectMode === 'Month'"
          (click)="viewMonth()"
        >
          <i class="fas fa-calendar-alt"></i><span>Mois</span>
        </button>
      </nav>
    </div>

    <div class="toolbar-actions">
      <!-- Densité d'affichage : agit sur les dimensions natives de DayPilot. -->
      <div class="zoom-control" role="group" aria-label="Densité d'affichage">
        <button
          type="button"
          class="zoom-btn"
          [disabled]="!canZoomOut"
          (click)="zoomOut()"
          title="Réduire l'affichage"
        >
          <i class="fas fa-minus"></i>
        </button>
        <span class="zoom-level">{{ zoomLabel }}</span>
        <button
          type="button"
          class="zoom-btn"
          [disabled]="!canZoomIn"
          (click)="zoomIn()"
          title="Agrandir l'affichage"
        >
          <i class="fas fa-plus"></i>
        </button>
      </div>

      <!-- Filtre équipe : les membres sont donnés à voir directement, sans
           passer par un menu. Un seul clic sur un visage suffit pour restreindre
           l'agenda ; le nom n'apparaît qu'au survol pour ne pas encombrer la
           barre. -->
      <div class="member-filter" role="group" aria-label="Filtrer par membre">
        <button
          type="button"
          class="avatar-chip"
          *ngFor="let member of visibleUsers; trackBy: trackByUserId"
          [class.selected]="isSelectedUser(member.id)"
          [attr.aria-pressed]="isSelectedUser(member.id)"
          [attr.aria-label]="memberFullName(member)"
          (click)="toggleUser(member.id)"
        >
          <user-avatar
            *ngIf="member.photo; else chipInitials"
            [src]="userService.getUrlPhoto(member)"
            [alt]="memberFullName(member)"
            class="avatar-chip-img"
          />
          <ng-template #chipInitials>
            <span class="avatar-chip-initials">{{ userInitials(member) }}</span>
          </ng-template>

          <!-- Infobulle maison plutôt que `title` : l'attribut natif met une
               seconde à apparaître, trop lent pour survoler une rangée de
               visages. -->
          <span class="chip-tip">{{ memberFullName(member) }}</span>
        </button>

        <!-- Débordement : au-delà de six visages la barre se disloque. -->
        <button
          type="button"
          class="avatar-chip avatar-chip--more"
          *ngIf="overflowUsers.length"
          [matMenuTriggerFor]="teamMenu"
          [attr.aria-label]="overflowUsers.length + ' autres membres'"
        >
          +{{ overflowUsers.length }}
        </button>

        <button
          type="button"
          class="filter-reset"
          *ngIf="usersSelected.length > 0"
          (click)="clearSelectedUsers()"
          title="Tout désélectionner"
        >
          <i class="fas fa-xmark"></i>
        </button>

        <span class="member-filter-empty" *ngIf="!users.length">Aucun membre</span>
      </div>

      <!-- Repli du menu de navigation du projet. Le calendrier est la page la
           plus gourmande en largeur : on offre le basculement ici plutôt que
           d'obliger à remonter chercher la flèche de la barre latérale. -->
      <button
        type="button"
        class="icon-btn workspace-toggle"
        [class.active]="layout.sidebarReduite"
        (click)="toggleWorkspaceSidebar()"
        [title]="layout.sidebarReduite ? 'Afficher le menu du projet' : 'Réduire le menu du projet'"
      >
        <i class="fas" [ngClass]="layout.sidebarReduite ? 'fa-compress' : 'fa-expand'"></i>
      </button>
    </div>
  </header>

  <div class="planning-body" [class.aside-collapsed]="!asideOpen">

    <!-- Voile mobile : le panneau y est une surcouche, il faut pouvoir le
         refermer d'un clic à côté. -->
    <div
      class="aside-backdrop"
      *ngIf="isMobile && asideOpen"
      (click)="closeAsideOnMobile()"
    ></div>

    <!-- Calendrier de saisie : sélection de la période affichée. Replié il
         reste dans le DOM (colonne réduite au rail) : le composant sert de
         référence de période à `loadEvents()`, le détruire casserait le
         chargement des événements. -->
    <aside class="planning-aside" id="planning-aside">
      <daypilot-navigator
        [config]="configNavigator"
        [events]="events"
        [(date)]="date"
        (dateChange)="changeDate($event)"
        #navigator>
      </daypilot-navigator>
    </aside>

    <!-- Poignée posée sur le bord du panneau, à l'image de la flèche du menu
         du projet. Hors de l'aside : celui-ci est écrêté au repli, la poignée
         disparaîtrait avec lui. -->
    <button
      type="button"
      class="aside-handle"
      [attr.aria-expanded]="asideOpen"
      aria-controls="planning-aside"
      (click)="toggleAside()"
      [title]="asideOpen ? 'Masquer le mini-calendrier' : 'Afficher le mini-calendrier'"
    >
      <i class="fas" [ngClass]="asideOpen ? 'fa-chevron-left' : 'fa-chevron-right'"></i>
    </button>

    <section class="planning-main">
      <daypilot-calendar [config]="configDay" [events]="events" #day></daypilot-calendar>
      <daypilot-calendar [config]="configWeek" [events]="events" #week></daypilot-calendar>
      <daypilot-month [config]="configMonth" [events]="events" #month></daypilot-month>
      <daypilot-calendar [config]="configResource" #calendar></daypilot-calendar>
    </section>
  </div>
</div>

<!-- =====================================================================
     Menus
     ===================================================================== -->

<!-- Débordement du filtre équipe : même grille d'avatars que dans la barre.
     stopPropagation est indispensable : le panneau de mat-menu émet `closed`
     sur n'importe quel clic, ce qui le refermerait à chaque sélection. -->
<mat-menu #teamMenu="matMenu" class="planning-menu">
  <div class="menu-panel" (click)="$event.stopPropagation()">
    <div class="menu-head">
      <span class="menu-title">Membres de l'équipe</span>
      <button
        type="button"
        class="menu-clear"
        *ngIf="usersSelected.length > 0"
        (click)="clearSelectedUsers()"
      >
        Effacer
      </button>
    </div>

    <div class="menu-grid">
      <button
        type="button"
        class="avatar-chip"
        *ngFor="let member of users; trackBy: trackByUserId"
        [class.selected]="isSelectedUser(member.id)"
        [attr.aria-pressed]="isSelectedUser(member.id)"
        [attr.aria-label]="memberFullName(member)"
        (click)="toggleUser(member.id)"
      >
        <user-avatar
          *ngIf="member.photo; else menuInitials"
          [src]="userService.getUrlPhoto(member)"
          [alt]="memberFullName(member)"
          class="avatar-chip-img"
        />
        <ng-template #menuInitials>
          <span class="avatar-chip-initials">{{ userInitials(member) }}</span>
        </ng-template>
        <span class="chip-tip">{{ memberFullName(member) }}</span>
      </button>

      <p class="menu-empty" *ngIf="!users.length">Aucun membre</p>
    </div>
  </div>
</mat-menu>

<!-- Trigger invisible positionné dynamiquement (édition d'un événement
     depuis le menu contextuel DayPilot). -->
<div
  #addPlanningTrigger="matMenuTrigger"
  [matMenuTriggerFor]="addPlanning"
  [style.position]="'fixed'"
  [style.left.px]="menuX"
  [style.top.px]="menuY"
  style="width:0;height:0;visibility:hidden;">
</div>

<mat-menu #addPlanning="matMenu">
  <div (click)="$event.stopPropagation()">
    <app-edit-event
      [event]="selectedEvent"
      #editEventForm
      [byIssue]="false"
      (saved)="closeEventForm()"
      [selectedMaster]="parentSelected"
      (onClose)="closeEventForm()"
    ></app-edit-event>
  </div>
</mat-menu>
