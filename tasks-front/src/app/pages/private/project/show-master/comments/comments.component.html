<div class="task-page">
  <div class="task-container">


    <!-- Section des commentaires -->
    <mat-card class="comments-section">
      <mat-card-header>
        <mat-card-title>Commentaires</mat-card-title>
      </mat-card-header>

      <mat-card-content>
        <div class="comment-list">
          <div class="comment" *ngFor="let comment of comments">
            <div class="comment-header">
              <img
                *ngIf="comment.user.photo"
                [src]="userService.getUrlPhoto(comment.user)"
                alt="{{ comment.user.username }}"
                class="user-photo"
              />
              <span class="user-name">{{ comment.user.firstName }}
                <small class="text-body-secondary" *ngIf="comment.date">{{comment.date | date}}</small>
            </span>
            </div>
            <p class="comment-text" [innerHTML]="comment.text"> </p>
          </div>
        </div>
        <app-quill-editor [(content)]="comment.text" [theme]="'snow'"></app-quill-editor>

          <button mat-raised-button color="primary" class="float-end" (click)="addComment()">
            Commenter
          </button>

      </mat-card-content>
    </mat-card>
  </div>
</div>
