<div class="task-page">
  <div class="task-container">
    <mat-card class="task-card">
      <mat-card-header>
        <mat-card-title>{{parentIssue.issueKey}} {{ parentIssue.summary }}</mat-card-title>
        <mat-card-subtitle>Description de la tâche</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <p>{{ parentIssue.description }}</p>

        <div class="custom-fields">
          <h4>Champs personnalisés</h4>
          <div class="field" *ngFor="let value of values">
              <app-custom-field
                [customFieldValue]="value" (save)="saveCustomFieldValue($event)"
                [viewMode]="viewModeField"
              > </app-custom-field>
          </div>
        </div>
      </mat-card-content>
    </mat-card>


  </div>
</div>
