<div class="task-page">
  <div class="task-container">
    <mat-card class="task-card">
      <mat-card-header>
        <mat-card-title>{{parentIssue.issueKey}} {{ parentIssue.summary }}</mat-card-title>
        <mat-card-subtitle>Description de la tâche</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <p>{{ parentIssue.description }}</p>

        <div class="custom-fields">
          <h4>Champs personnalisés</h4>
          <div class="field" *ngFor="let value of values">
              <app-custom-field
                [customFieldValue]="value" (save)="saveCustomFieldValue($event)"
                [viewMode]="viewModeField"
              > </app-custom-field>
          </div>
        </div>
      </mat-card-content>
    </mat-card>

    <!-- Section des commentaires -->
    <mat-card class="comments-section">
      <mat-card-header>
        <mat-card-title>Commentaires</mat-card-title>
      </mat-card-header>

      <mat-card-content>
        <div class="comment-list">
          <div class="comment" *ngFor="let comment of comments">
            <div class="comment-header">
              <img
                *ngIf="comment.user.photo"
                [src]="userService.getUrlPhoto(comment.user)"
                alt="{{ comment.user.username }}"
                class="user-photo"
              />
              <span class="user-name">{{ comment.user.firstName }}</span>
            </div>
            <p class="comment-text">{{ comment.text }}</p>
          </div>
        </div>

        <div class="add-comment">
          <mat-form-field appearance="fill" class="comment-input">
            <mat-label>Ajouter un commentaire</mat-label>
            <textarea matInput [(ngModel)]="comment.text"></textarea>
          </mat-form-field>

          <button mat-raised-button color="primary" (click)="addComment()">
            Publier
          </button>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
