<div class="config-project" [class.collapsed]="collapsed">
  <aside class="config-sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <div class="brand-icon"><i class="fas fa-sliders-h"></i></div>
        <div class="brand-text">
          <span class="brand-title">Configuration</span>
          <span class="brand-subtitle" [title]="project?.name">
            {{ project?.prefix || project?.name || 'Projet' }}
          </span>
        </div>
      </div>
      <button class="collapse-btn" (click)="toggleSidebar()"
              [title]="collapsed ? 'Déplier le menu' : 'Replier le menu'">
        <i class="fas" [ngClass]="collapsed ? 'fa-chevron-right' : 'fa-chevron-left'"></i>
      </button>
    </div>

    <nav class="navigation-config">
      <a class="config-nav-item" *ngFor="let menu of visibleMenus"
         [routerLink]="menu.route" routerLinkActive="active" [title]="menu.label">
        <i [ngClass]="menu.icon"></i>
        <span class="nav-text">
          <span class="nav-label">{{ menu.label }}</span>
          <span class="nav-description">{{ menu.description }}</span>
        </span>
      </a>

      <div class="nav-empty" *ngIf="visibleMenus.length === 0">
        <i class="fas fa-lock"></i>
        <span>Aucun paramètre accessible</span>
      </div>
    </nav>
  </aside>

  <section class="config-content">
    <router-outlet></router-outlet>
  </section>
</div>
