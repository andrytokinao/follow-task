  <div class="work-flow">
    <div >
      <h1> Type des taches </h1>
      <div class="issuetype-liste">
        <ul class="list-group">
          <li class="list-group-item list-group-item-action pointer-event" *ngFor="let itype of project.issueTypes" >
            <app-icone-view [icon]="itype.icone" [width]="'fa-1x'"></app-icone-view>
            {{ itype.name }}
            <span class="float-md-end pointer-event" (click)="openStepperDialog(itype)" > Edit
           <i class="mat-icon  fa fa-edit"  > </i>
          </span>
          </li>
          <li class="list-group-item list-group-item-action" style="text-align: center;margin-top: 5px" (click)="openStepperDialog(undefined)" > <i class="fas fa-plus-square"> </i> Nouveau</li>
        </ul>
      </div>
    </div>
  </div>
</div>
