<div class="work-flow">
  <div>
    <h1>Flux de travails </h1>
    <ul class="list-group">
      <li class="list-group-item list-group-item-action pointer-event" *ngFor="let flow of workFlows"
          (click)="openStepper(flow)">
        {{ flow.name }}
      </li>

      <li class="list-group-item list-group-item-action" style="text-align: center;margin-top: 5px"
          (click)="openStepper(null)"><i class="fas fa-plus-square"> </i> Nouveau
      </li>

    </ul>

  </div>

</div>
