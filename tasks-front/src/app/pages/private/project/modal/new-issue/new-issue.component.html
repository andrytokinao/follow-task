<div class="modal-header">
  <h4 class="modal-title">Ajouter tache  </h4>
  <span typeField="button" class="close" aria-label="Close" (click)="activeModal.dismiss()">
    <i class="fas fa-close"></i>  <span aria-hidden="true"></span>
  </span>
</div>
<div class="modal-body">
  <form #f="ngForm" (ngSubmit)="save()">
    <div class="form-group" #parentIssue>
      <mat-form-field style="width: 100%">
        <mat-label>Clé </mat-label>
        <input matInput
               cdkTextareaAutosize
               cdkAutosizeMinRows="1"
               [(ngModel)]="issueKey"
               [ngModelOptions]="{standalone: true}"
               cdkAutosizeMaxRows="5"/>
      </mat-form-field>
      <mat-form-field style="width: 100%" >
        <mat-label>Type </mat-label>
        <mat-select [(value)]="issueType" (valueChange)="changeType()" >
          <mat-option *ngFor="let type of useIssueType" [value]="type" style="z-index: 1060">{{type.name}}</mat-option>
        </mat-select>
      </mat-form-field>
      <mat-form-field style="width: 100%">
        <mat-label>Titre </mat-label>
        <input
          matInput
          [(ngModel)]="summary"
          [ngModelOptions]="{standalone: true}"
          class="form-control"
          typeField="text">
      </mat-form-field>
      <mat-form-field  style="width: 100%;min-height: 100px" >
        <mat-label>Text description</mat-label>
        <textarea
          matInput
          placeholder="Description .."
          [(ngModel)]="description"
          [ngModelOptions]="{standalone: true}"
         ></textarea>
      </mat-form-field>


    </div>
  </form>
</div>
<div class="modal-footer">
  <button typeField="button" class="btn btn-primary" (click)="cancel()">Annuler</button>
  <button typeField="button" class="btn btn-primary" [disabled]="isDesable" (click)="complete()">Terminé</button>
  <button typeField="button" class="btn btn-primary" [disabled]="isDesable" (click)="next()">Continue</button>
</div>
