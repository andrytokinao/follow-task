<div class="nd-overlay"
     [class.nd-overlay--inline]="mode === 'reply'"
     (dragover)="onDragOver($event)"
     (drop)="onDrop($event)"
     (click)="$event.stopPropagation()">

  <!-- Header -->
  <div class="nd-header" *ngIf="mode === 'create'">
    <div class="nd-header-left">
      <span class="nd-icon">⊕</span>
      <span class="nd-title">Composer une demande</span>
    </div>
    <button class="nd-btn-icon" type="button" (click)="close()">✕</button>
  </div>

  <div class="nd-body">

    <div class="nd-section" *ngIf="mode === 'create'">
      <label class="nd-label required">Département / Équipe</label>
      <div class="nd-radio-group">
        <label
          *ngFor="let p of projects"
          class="nd-radio-item"
          [class.active]="newDocument.project?.id === p.id">
          <input
            type="radio"
            name="project"
            [value]="p.id"
            [checked]="newDocument.project?.id === p.id"
            (change)="selectProject(p)"
          />
          <span class="nd-radio-dot"></span>
          <span class="nd-radio-prefix">{{ p.prefix }}</span>
          <span class="nd-radio-name">{{ p.name }}</span>
        </label>
      </div>
      <p class="nd-hint" *ngIf="!newDocument.project">Sélectionnez un département ou une équipe.</p>
    </div>

    <!-- Titre -->
    <div class="nd-section" *ngIf="mode === 'create'" >
      <label class="nd-label">Sujet </label>
      <input
        class="nd-input"
        type="text"
        placeholder="Sujet de votre demande…"
        [(ngModel)]="newDocument.titre"
        [ngModelOptions]="{standalone: true}"
      />
    </div>

    <!-- Membres -->
    <div class="nd-section" *ngIf="mode === 'create'">
      <label class="nd-label">Membres</label>
      <div class="nd-members">
        <label
          *ngFor="let user of userToSelect"
          class="nd-member-item"
          [class.checked]="isSelectedUser(user.id)">
          <input
            type="checkbox"
            [checked]="isSelectedUser(user.id)"
            (change)="selectUser($event, user)"
          />
          <span class="nd-avatar">{{ user.username?.charAt(0) | uppercase }}</span>
          <span class="nd-member-name">{{ user.username }}</span>
          <span class="nd-check">✓</span>
        </label>
      </div>
    </div>

    <!-- Description -->
    <div class="nd-section">
      <label class="nd-label">Description</label>
      <div class="nd-editor-wrap">
        <app-quill-editor [(content)]="newDocument.description"></app-quill-editor>
      </div>
    </div>

    <!-- Zone fichiers -->
    <div class="nd-section">
      <div class="nd-dropzone" (click)="fileInput.click()">
        <input type="file" multiple (change)="onFileSelected($event)" hidden #fileInput />
        <span class="nd-drop-icon">↑</span>
        <span class="nd-drop-text">Glissez ou cliquez pour ajouter des fichiers</span>
      </div>

      <div class="nd-file-list" *ngIf="uploadings.length > 0">
        <div
          *ngFor="let up of uploadings; let i = index"
          class="nd-file-item"
          [ngClass]="up.status">
          <span class="nd-file-icon">📄</span>
          <span class="nd-file-name clamp clamp-1">{{ up.file.name }}</span>
          <span class="nd-file-status">{{ up.status }}</span>
          <button class="nd-btn-icon sm" type="button" (click)="removeFile(i)">✕</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Footer -->
  <div class="nd-footer">
    <button class="nd-btn secondary" type="button" (click)="close()">Annuler</button>
    <button
      class="nd-btn primary"
      type="button"
      [disabled]="!isFormValid()"
      (click)="saveDocument()">
      Envoyer
    </button>
  </div>

</div>
