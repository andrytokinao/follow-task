<div>
  <mat-card >
    <mat-card-header>
      <mat-card-title>{{event.title}}</mat-card-title>
      <mat-card-subtitle>{{event.description}}</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
<!--
      <p>{{ event.description }}</p>
-->
    </mat-card-content>
  </mat-card>
  <mat-card *ngIf="event.issue &&  event.issue.parent" >
    <mat-card-header (click)="browseIssueMaster(event.issue.parent)">
      <mat-card-title >{{event.issue.parent.issueType.name}}</mat-card-title>
      <mat-card-subtitle>{{event.issue.parent.issueKey+': '+event.issue.parent.summary}}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p>{{ event.issue.parent.description }}</p>
      <mat-card >
        <mat-card-header >
          <mat-card-title (click)="openEditIssue(event.issue)" >{{event.issue.issueType.name}}</mat-card-title>
          <app-status-field [issue]="event.issue"></app-status-field>
          <mat-card-subtitle>{{event.issue.issueKey+': '+event.issue.summary}}</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
          <p>{{ event.issue.description }}</p>
        </mat-card-content>
      </mat-card>
    </mat-card-content>

  </mat-card>

</div>
