<app-loading [isLoading]="isLoading"></app-loading>

<!-- Topbar — desktop uniquement -->
<div class="master-topbar">

  <button class="btn-new" [matMenuTriggerFor]="newMasterMenu"
          #createMasterTrigger="matMenuTrigger"
          (menuOpened)="onMenuOpened()"
          *ngIf="projectGuard.hasCredential(['PROJECT_MANAGER']) | async">
    <i class="fas fa-plus"></i> Nouveau projet
  </button>

  <!-- Groupe droite : recherche + filtre + vue -->
  <div class="topbar-right">

    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" placeholder="Rechercher…" [(ngModel)]="searchTerm" />
    </div>

    <button mat-button [matMenuTriggerFor]="filterMenu"
            class="filter-trigger"
            [class.active]="selectedFilter && selectedFilter.id !== noFilter.id">
      <i class="fas fa-filter"></i>
      {{ selectedFilter?.name || noFilter.name }}
      <span class="filter-badge" *ngIf="selectedFilter && selectedFilter.id !== noFilter.id">1</span>
      <i class="fas fa-chevron-down"></i>
    </button>

    <mat-menu #filterMenu="matMenu" class="filter-mat-menu">
      <button mat-menu-item
              [class.active-item]="selectedFilter?.id === noFilter.id"
              (click)="selectFilter(noFilter)">
        {{ noFilter.name }}
      </button>
      <mat-divider></mat-divider>
      <button mat-menu-item
              *ngFor="let filter of masterFilter"
              [class.active-item]="selectedFilter?.id === filter.id"
              (click)="selectFilter(filter)">
        <span>{{ filter.name }}</span>
        <i class="fas fa-edit edit-icon"
           (click)="editFilter($event, filter); $event.stopPropagation()"></i>
      </button>
      <mat-divider></mat-divider>
      <button mat-menu-item class="new-filter-item" (click)="newParentFilter($event)">
        <i class="fas fa-plus"></i> Nouveau filtre
      </button>
    </mat-menu>

    <!-- La liste en cartes n'est pas proposée ici : c'est la vue mobile. -->
    <div class="view-toggle">
      <button [class.active]="effectiveView === 'table-master'"
              (click)="setView('table-master')" title="Tableau">
        <i class="fas fa-table"></i>
      </button>
      <button [class.active]="effectiveView === 'board'"
              (click)="setView('board')" title="Board">
        <i class="fas fa-columns"></i>
      </button>
    </div>

  </div>
</div>

<!-- Contenu principal. effectiveView, et non currentView : sur mobile la vue
     tableau retombe automatiquement sur la liste en cartes. -->
<div class="master-content">
  <app-table-master      *ngIf="effectiveView === 'table-master'"></app-table-master>
  <app-issue-master-list *ngIf="effectiveView === 'details'"></app-issue-master-list>
  <app-issue-boaard      *ngIf="effectiveView === 'board'"></app-issue-boaard>
</div>

<!-- Barre mobile en bas (pas de topbar sur mobile).
     Plus de sélecteur de vue : la liste en cartes est la seule vue mobile. -->
<nav class="mobile-bottom-bar">
  <button [matMenuTriggerFor]="filterMenu"
          [class.active]="selectedFilter && selectedFilter.id !== noFilter.id">
    <i class="fas fa-filter"></i><span>Filtres</span>
  </button>

  <!-- Recherche expansible -->
  <div class="search-expand" [class.open]="searchOpen">
    <button class="search-icon-btn" (click)="toggleMobileSearch()">
      <i class="fas fa-search"></i>
    </button>
    <input #mobileSearchInput
           type="text"
           placeholder="Rechercher…"
           [(ngModel)]="searchTerm"
           (blur)="onSearchBlur()" />
  </div>
</nav>

<mat-menu #newMasterMenu="matMenu">
  <app-new-issue-form  [isMaster]="true"
                      #newIssueForm (saved)="closeIssueFormMenu()">
  </app-new-issue-form>
</mat-menu>
