<app-loading [isLoading]="isLoading"></app-loading>

<div class="list-menu-with-left-right">
  <div class="card-list menu-btn">
    <div class="filter-container">
      <b (click)="issueService.createIssueMaster()" class="bouton" style="color:#007BFF;text-align: center" *ngIf="projectGuard.hasCredential(['PROJECT_MANAGER']) | async">
       Nouveau projet <i class="fas fa-plus"  ></i>
      </b>
      <h1 class="filter-title">Gérer les filtres de recherche</h1>
      <ul class="navigation-list">
        <li  class="filter-item"  [ngClass]="{'active':noFilter.id === selectedFilter?.id}">
          <a class="filter-link" (click)="selectFilter(noFilter)" >
            {{ noFilter.name }}
          </a>
        </li>
        <li *ngFor="let filter of masterFilter" class="filter-item" [ngClass]="{'active':filter?.id === selectedFilter?.id}">
          <a class="filter-link" (click)="selectFilter(filter)" >
            {{ filter.name }}
            <i class="fas fa-edit edit-icon"  style="float: right" (click)="editFilter($event, filter)"></i>
          </a>
        </li>
        <li class="new-filter-btn" (click)="newParentFilter($event)">
          Nouveau filtre <i class="fas fa-plus add-icon"></i>
        </li>
      </ul>
    </div>
  </div>

  <div>
    <div *ngIf="currentView ==='list'">
      <app-issue-master-list ></app-issue-master-list>
    </div>
    <div *ngIf="currentView ==='board'">
      <app-board-list [searchCriteria] = "searchCriteria"></app-board-list>
    </div>
    <div *ngIf="currentView ==='calendar'">
      <app-calendar-list ></app-calendar-list>
    </div>
    <div *ngIf="currentView ==='table-master'">
      <app-table-master ></app-table-master>
    </div>
  </div>
  <div>
    <nav class="list-show-menue">
      <button class="buttons" (click)="setView('board')">
        <i class = "fas fa-th-large"> </i>
      </button>
      <button class="buttons" (click)="setView('table-master')">
        <i class = "fas fa-list"> </i>
      </button>
      <button class="buttons" (click)="setView('list')">
        <i class = "fas fa-info-circle"> </i>
      </button>
    </nav>
  </div>
</div>
