<div class="issue-list">


  <div class="mat-elevation-z8">
    <table mat-table [dataSource]="dataSource" matSort >

      <ng-container matColumnDef="parrent">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Parent</th>
        <td mat-cell *matCellDef="let element" class="controle" (click)="issueService.browsIssueMaster(element.parent)"> <span *ngIf="element.parent!=null"><app-icone-view [icon]="element.parent.issueType.icone"></app-icone-view>{{element.parent.issueKey}}</span></td>
      </ng-container>

      <ng-container matColumnDef="Titre">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Titre</th>
        <td mat-cell *matCellDef="let element" (click)="editIssue(element)" > <p><b>{{element.issueKey}}</b></p> <p>{{element.summary}}</p></td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Description</th>
        <td mat-cell *matCellDef="let element"  > <show-issue-option [issue] = "element" [label]="element.description" ></show-issue-option></td>
      </ng-container>

      <ng-container matColumnDef="issueKey" class="menu">
        <th mat-header-cell *matHeaderCellDef mat-sort-header style="width: 150px">Issue Key</th>
        <td mat-cell *matCellDef="let element"> <show-issue-option [issue] = "element" [label]="element.issueKey" ></show-issue-option></td>
      </ng-container>

      <ng-container matColumnDef="issueType">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Issue Type</th>
        <td mat-cell *matCellDef="let element"><app-icone-view [icon]="element.issueType.icone" ></app-icone-view> {{element.issueType.name}} </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-heade style="width: 170px">Status</th>
        <td mat-cell *matCellDef="let element">  <app-status-field (onUpdateIssue)="search()"  [issue]="element"></app-status-field></td>

      </ng-container>
      <ng-container matColumnDef="assigne">
        <th mat-header-cell *matHeaderCellDef mat-sort-header style="min-width: 200px">Assigné</th>
        <td mat-cell *matCellDef="let element">  <app-assign-field [issue]="element" (save)="search()" ></app-assign-field>   </td>
      </ng-container>
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef mat-sort-header style="width: 120px">action</th>
        <td mat-cell *matCellDef="let element">  <p class="controle" (click)="editIssue(element)"> <i class="fas fa-d" > </i> Détails </p>  <p class="controle" (click)="issueService.showPlanning(element)"> <i class="fas fa-calendar"> </i>  Planing </p>  </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" ></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 20]"
                   showFirstLastButtons
                   aria-label="Select page of periodic elements">
    </mat-paginator>
  </div>
</div>
