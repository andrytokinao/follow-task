<div class="issue-list">


  <div class="mat-elevation-z8">
    <table mat-table [dataSource]="dataSource" matSort>

      <ng-container matColumnDef="parrent">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Parent</th>
        <td mat-cell *matCellDef="let element" class="controle" (click)="issueService.browsIssueMaster(element.parent)"> <span *ngIf="element.parent!=null"><app-icone-view [icon]="element.parent.issueType.icone"></app-icone-view>{{element.parent.issueKey}}</span></td>
      </ng-container>

      <ng-container matColumnDef="summary">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Summary</th>
        <td mat-cell *matCellDef="let element" class="controle"  (click)="editIssue(element)">{{element.summary}}</td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Description</th>
        <td mat-cell *matCellDef="let element" class="controle"  (click)="editIssue(element)">{{element.description}}</td>
      </ng-container>

      <ng-container matColumnDef="issueKey">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Issue Key</th>
        <td mat-cell *matCellDef="let element">{{element.issueKey}}</td>
      </ng-container>

      <ng-container matColumnDef="issueType">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Issue Type</th>
        <td mat-cell *matCellDef="let element"><app-icone-view [icon]="element.issueType.icone" ></app-icone-view> {{element.issueType.name}} </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
        <td mat-cell *matCellDef="let element">  <app-status-field (onUpdateIssue)="search()"  [issue]="element"></app-status-field></td>

      </ng-container>
      <ng-container matColumnDef="assigne">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Assigné</th>
        <td mat-cell *matCellDef="let element">  <app-assign-field [issue]="element" (save)="search()" ></app-assign-field>   </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" ></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[ 10, 20]"
                   showFirstLastButtons
                   aria-label="Select page of periodic elements">
    </mat-paginator>
  </div>
</div>
