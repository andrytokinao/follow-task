<div class="user-role-dialog">
  <h1> Ajout d'utilisateure au groupe {{groupeUser.name}}</h1>
  <mat-grid-list cols="2" >
    <mat-grid-tile>
      <mat-form-field class="example-full-width">
        <input
          [disabled]="roUser"
          type="text"
          matInput
          [formControl]="userControl"
          [matAutocomplete]="auto"
          placeholder="Rechercher un utilisateur"
          (focus)="onFocus()"
        >
        <mat-autocomplete #auto="matAutocomplete">
          <mat-option *ngFor="let user of filteredUsers | async" [value]="user.username"  >
            <img [src]="user.photo" alt=" " width="30" height="30" style="margin-right: 10px;">
            {{ user.firstName }} {{ user.lastName }} ({{ user.username }})
          </mat-option>
        </mat-autocomplete>
      </mat-form-field>
    </mat-grid-tile>

    <mat-grid-tile>
      <div class="role-checkboxes">
        <h3>Rôles</h3>
        <mat-checkbox *ngFor="let role of roles" [checked]="idChecked(role)" (change)="onRoleChange($event, role.value)">
          {{ role.affichage }}
        </mat-checkbox>
      </div>
    </mat-grid-tile>
  </mat-grid-list>

  <div class="register-button">
    <button mat-raised-button color="primary" (click)="register()">Ajouter</button>
  </div>
</div>
