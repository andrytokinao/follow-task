<div class="admin-shell" [class.collapsed]="collapsed">
  <aside class="admin-sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <div class="brand-icon"><i class="fas fa-shield-alt"></i></div>
        <div class="brand-text">
          <span class="brand-title">Administration</span>
          <span class="brand-subtitle">Espace de travail</span>
        </div>
      </div>
      <button class="collapse-btn" (click)="toggleSidebar()"
              [title]="collapsed ? 'Déplier le menu' : 'Replier le menu'">
        <i class="fas" [ngClass]="collapsed ? 'fa-chevron-right' : 'fa-chevron-left'"></i>
      </button>
    </div>

    <nav class="sidebar-nav">
      <a class="admin-nav-item" *ngFor="let menu of visibleMenus"
         [routerLink]="menu.route" routerLinkActive="active" [title]="menu.label">
        <i [ngClass]="menu.icon"></i>
        <span class="nav-text">
          <span class="nav-label">{{ menu.label }}</span>
          <span class="nav-description">{{ menu.description }}</span>
        </span>
      </a>
    </nav>
  </aside>

  <section class="admin-content">
    <router-outlet></router-outlet>
  </section>
</div>
