<div class="modal-wrapper">
  <!-- Header -->
  <div class="modal-header">
    <div class="header-left">
      <div class="header-icon">
        <i class="fas fa-user-edit"></i>
      </div>
      <div>
        <span class="modal-title">{{ action }}</span>
        <span class="modal-subtitle">Gérer les informations du compte</span>
      </div>
    </div>
    <button class="close-btn" (click)="activeModal.dismiss()">
      <i class="fas fa-times"></i>
    </button>
  </div>

  <!-- Status Banner -->
  <div class="status-banner success" *ngIf="savingStatus === 'success'">
    <i class="fas fa-check-circle"></i> Enregistrement réussi.
  </div>
  <div class="status-banner error" *ngIf="savingStatus === 'error'">
    <i class="fas fa-exclamation-circle"></i> Une erreur est survenue.
  </div>

  <!-- Body -->
  <div class="modal-body">
    <div class="two-col-layout">

      <!-- LEFT: Form -->
      <div class="form-panel">
        <div class="avatar-section">
          <div class="avatar-wrapper" (click)="openPhotoInput()">
            <img [src]="photoUrl()" alt="Photo utilisateur" class="avatar-img" />
            <div class="avatar-overlay">
              <i class="fas fa-camera"></i>
            </div>
          </div>
          <input style="display:none" type="file" id="photoInput" (change)="selectPhoto($event)" accept="image/*" />
          <button *ngIf="tempPhoto" class="btn-save-photo" (click)="uploadPhoto()">
            <i class="fas fa-check"></i> Confirmer la photo
          </button>
        </div>

        <div class="section-label">Informations personnelles</div>

        <div class="input-row">
          <div class="input-group half">
            <label>Nom</label>
            <div class="input-wrap">
              <i class="fas fa-user"></i>
              <input type="text" placeholder="Nom de famille" [(ngModel)]="user.firstName" [ngModelOptions]="{standalone: true}" />
            </div>
          </div>
          <div class="input-group half">
            <label>Prénom</label>
            <div class="input-wrap">
              <i class="fas fa-user"></i>
              <input type="text" placeholder="Prénom" [(ngModel)]="user.lastName" [ngModelOptions]="{standalone: true}" />
            </div>
          </div>
        </div>

        <div class="input-group">
          <label>Nom d'utilisateur</label>
          <div class="input-wrap">
            <i class="fas fa-at"></i>
            <input type="text" placeholder="ex: jean.dupont" [(ngModel)]="user.username" [ngModelOptions]="{standalone: true}" />
          </div>
        </div>

        <div class="input-group">
          <label>Adresse e-mail</label>
          <div class="input-wrap">
            <i class="fas fa-envelope"></i>
            <input type="email" placeholder="email@exemple.com" [(ngModel)]="user.email" [ngModelOptions]="{standalone: true}" />
          </div>
        </div>

        <div class="input-row">
          <div class="input-group half">
            <label>Téléphone</label>
            <div class="input-wrap">
              <i class="fas fa-phone"></i>
              <input type="text" placeholder="+261 XX XXX XXX" [(ngModel)]="user.contact" [ngModelOptions]="{standalone: true}" />
            </div>
          </div>
          <div class="input-group half">
            <label>CIN</label>
            <div class="input-wrap">
              <i class="fas fa-id-card"></i>
              <input type="text" placeholder="Numéro CIN" [(ngModel)]="user.cin" [ngModelOptions]="{standalone: true}" />
            </div>
          </div>
        </div>

        <div class="input-group">
          <label>Adresse</label>
          <div class="input-wrap">
            <i class="fas fa-map-marker-alt"></i>
            <input type="text" placeholder="Adresse complète" [(ngModel)]="user.address" [ngModelOptions]="{standalone: true}" />
          </div>
        </div>

        <div class="input-group" *ngIf="isCreate">
          <label>Mot de passe</label>
          <div class="input-wrap">
            <i class="fas fa-lock"></i>
            <input type="password" placeholder="••••••••" [(ngModel)]="user.password" [ngModelOptions]="{standalone: true}" />
          </div>
        </div>
      </div>

      <!-- RIGHT: Groups -->
      <div class="groups-panel">
        <div class="section-label">Accessibilité & Groupes</div>

        <div class="groups-table">
          <div class="groups-header">
            <span>Groupe</span>
            <span>Rôle</span>
            <span>Actions</span>
          </div>

          <div class="group-row" *ngFor="let memberGroupe of memberGroupes">
            <span class="group-name">
              <i class="fas fa-users"></i>
              {{ memberGroupe.groupe.name }}
            </span>
            <span class="group-role">{{ memberGroupe.roles }}</span>
            <span class="group-actions">
              <button class="icon-btn danger" title="Supprimer"><i class="fas fa-trash-alt"></i></button>
              <button class="icon-btn" title="Paramètres"><i class="fas fa-sliders-h"></i></button>
            </span>
          </div>

          <div class="empty-state" *ngIf="memberGroupes.length === 0">
            <i class="fas fa-layer-group"></i>
            <span>Aucun groupe assigné</span>
          </div>
        </div>

        <button class="btn-add-group">
          <i class="fas fa-plus"></i> Ajouter un groupe
        </button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="modal-footer">
    <button class="btn-cancel" (click)="activeModal.dismiss()">
      Annuler
    </button>
    <button class="btn-primary" (click)="saveUser()">
      <i class="fas fa-save"></i> Enregistrer
    </button>
  </div>
</div>
