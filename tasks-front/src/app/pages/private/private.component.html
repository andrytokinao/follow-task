<div class="grid-container">
  <div class="top-menu">
    <div class="logo" [routerLink]=""><img [src]="logoUrl" alt="VOTRE LOGO" height="50px" [matMenuTriggerFor]="choixLogo">
      <button *ngIf="tempLogo" (click)="saveLogo()"> save </button>
    </div>
    <mat-menu #choixLogo = "matMenu" (click) = "$event.stopPropagation()">
      <div *ngIf="systemGuerd.hasAutorityAsync(['ADMIN']) | async"
        (click)="fileInput.click()"
        class="file-drop-zone">
        <input type="file"  (change)="selectLogo($event)" hidden #fileInput>
        <p>Selectionner une image </p>
      </div>
    </mat-menu>
    <ul class="navigation">
      <li><a routerLink="" ariaCurrentWhenActive="page">Home</a></li>
      <!--<li>
        <div class="user-dropdown">
          <span class="username">Projet</span>
          <div class="user-dropdown-content">
            <div class="item controle"  *ngFor="let project of projects" (click)="selectProject(project)">{{project.name}}</div>
            <div class="item controle" *ngIf="authGuard.hasAutorityAsync(['CAN_CREATE_PROJECT']) | async"  routerLink="admin/working/create"> Creer </div>
          </div>
        </div>
      </li>-->
      <li><a routerLink="admin/users" *ngIf="authGuard.hasAutorityAsync(['CAN_CONFIGURE_SYSTEM']) | async" routerLinkActive="active" ariaCurrentWhenActive="page">Admin</a></li>
    </ul>
    <div class="user-section">
      <div class="notification-icon" [matMenuTriggerFor]="notificationMenu" (click)="seenNotification()">
         <i class="fas fa-bell"></i> <!-- Icône de notification -->
        <span class="badge" *ngIf="unrededNofication != 0"> {{unrededNofication}}</span>
      </div>
      <div class="user-dropdown">
        <img [src]="userService.getUrlPhoto(profile)" alt="P">
        <span class="username">{{connectedUser?.firstName}} {{connectedUser?.lastName}}</span>
        <div class="user-dropdown-content">
          <div class="item controle" (click)="myProfile()" >Profile</div>
          <div class="item controle" href="#">Settings</div>
          <div
            class="item controle"
            [class.disabled]="isLoggingOut"
            (click)="logout()"
          >
            <span *ngIf="!isLoggingOut">Logout</span>
            <span *ngIf="isLoggingOut">Déconnexion...</span>
          </div>        </div>
      </div>
    </div>
  </div>

  <div class="content"   >
    <router-outlet ></router-outlet>
  </div>
  <div class="smart-footer-container" >
    <smart-footer></smart-footer>

  </div>

  <mat-menu #notificationMenu ="matMenu" [ngStyle]="{'width': '6000px'}" >
   <app-notifications [notifications]="notifications"></app-notifications>
  </mat-menu>

</div>
