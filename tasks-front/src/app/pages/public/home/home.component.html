<div class="hero">
  <div class="hero-content">
    <h1 class="hero-title">
      Bienvenue sur <span class="highlight">Votre Plateforme</span>
    </h1>
    <p class="hero-subtitle">
      Organisez, attribuez et suivez les tâches de votre équipe de manière efficace et collaborative.<span class="wave">👋</span>
    </p>
    <button mat-raised-button color="primary" (click)="start()">Commencez</button>
  </div>
  <canvas id="background-animation"></canvas>
</div>
<!-- Bouton principal -->
<button mat-button [matMenuTriggerFor]="menuPrincipal">Ouvrir le formulaire</button>

<mat-menu #menuPrincipal="matMenu" [hasBackdrop]="true">
  <div class="menu-form" (click)="$event.stopPropagation()">
    <form #form="ngForm">
      <mat-form-field appearance="fill">
        <mat-label>Nom</mat-label>
        <input matInput name="nom" ngModel>
      </mat-form-field>

      <!-- Sous-menu -->
      <button
        mat-button
        [matMenuTriggerFor]="sousMenu"
        #subMenuTrigger="matMenuTrigger"
        (click)="$event.stopPropagation()"
      >
        Choisir une option : {{ selectedValue || 'Aucune' }}
      </button>

      <mat-menu #sousMenu="matMenu" [hasBackdrop]="false">
        <div class="sub-options" (click)="$event.stopPropagation()">
          <button mat-button (click)="select('Option 1', subMenuTrigger)">Option 1</button>
          <button mat-button (click)="select('Option 2', subMenuTrigger)">Option 2</button>
          <button mat-button (click)="select('Option 3', subMenuTrigger)">Option 3</button>
        </div>
      </mat-menu>

      <div class="actions">
        <button mat-raised-button color="primary" (click)="save(form)">Save</button>
      </div>
    </form>
  </div>
</mat-menu>



<section id="features" class="features">
  <h2 class="section-title">Avantage </h2>
  <div class="features-grid">
    <mat-card class="feature" *ngFor="let feature of features">
      <mat-icon class="feature-icon">{{ feature.icon }}</mat-icon>
      <h3>{{ feature.title }}</h3>
      <p>{{ feature.description }}</p>
    </mat-card>
  </div>
  <button type="button" class="btn btn-primary"
          [ngbPopover]="formTemplate"
          popoverTitle="Formulaire"
          triggers="click:click"
          placement="auto">
    Ouvrire
  </button>

  <ng-template #formTemplate>
    <form (ngSubmit)="onSubmit()" #f="ngForm" style="width: 200px;">
      <div class="mb-2">
        <label>Nom :</label>
        <input name="nom" ngModel class="form-control">
      </div>
      <div class="mb-2">
        <label>Email :</label>
        <input name="email" ngModel type="email" class="form-control">
      </div>
      <button class="btn btn-success w-100" type="submit">Envoyer</button>
    </form>
  </ng-template>


</section>
